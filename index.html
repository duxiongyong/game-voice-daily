<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏舆情 · 多游戏用户声音日报</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0D1117; --bg-secondary: #161B22; --bg-card: #1C2128; --bg-hover: #252C35;
            --border: #30363D; --text-primary: #E6EDF3; --text-secondary: #8B949E; --text-muted: #6E7681;
            --accent-blue: #58A6FF; --accent-green: #3FB950; --accent-red: #F85149; --accent-amber: #D29922;
            --accent-purple: #BC8CFF; --accent-cyan: #39D2C0;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; font-size: 14px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 24px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
        .header h1 { font-size: 22px; font-weight: 600; }
        .header h1 span { color: var(--accent-blue); }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .date-picker-wrap { position: relative; }
        .date-picker-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; color: var(--text-primary); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .date-picker-btn:hover { border-color: var(--accent-blue); }
        .date-picker-btn .arrow { font-size: 10px; color: var(--text-muted); transition: transform 0.2s; }
        .date-picker-btn .arrow.open { transform: rotate(180deg); }
        .date-dropdown { display: none; position: absolute; top: calc(100% + 6px); right: 0; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 6px; z-index: 200; min-width: 200px; max-height: 320px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .date-dropdown.show { display: block; }
        .date-option { padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-secondary); transition: all 0.15s; }
        .date-option:hover { background: var(--bg-hover); color: var(--text-primary); }
        .date-option.active { background: var(--accent-blue); color: #fff; }
        .date-option.no-data { color: var(--text-muted); cursor: default; }
        .date-option.no-data:hover { background: transparent; }
        .date-info { color: var(--text-secondary); font-size: 13px; text-align: right; }
        .date-info strong { color: var(--text-primary); font-size: 15px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .metric-card { background: var(--bg-card); border-radius: 10px; padding: 20px; border: 1px solid var(--border); position: relative; }
        .metric-card .label { color: var(--text-secondary); font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 6px; }
        .metric-card .value { font-size: 28px; font-weight: 600; }
        .metric-card .change { font-size: 12px; margin-top: 4px; }
        .metric-card .change.up { color: var(--accent-red); }
        .metric-card .change.down { color: var(--accent-green); }
        .metric-card.total .value { color: var(--accent-blue); }
        .metric-card.positive .value { color: var(--accent-green); }
        .metric-card.negative .value { color: var(--accent-red); }
        .metric-card.alert .value { color: var(--accent-amber); }
        .info-badge { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: var(--bg-hover); color: var(--text-secondary); font-size: 10px; cursor: help; font-weight: 700; font-style: normal; line-height: 1; border: 1px solid var(--border); transition: all 0.2s; }
        .info-badge:hover { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
        .info-tooltip { display: none; position: absolute; top: 100%; right: 0; margin-top: 8px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; font-size: 12px; color: var(--text-secondary); line-height: 1.8; z-index: 100; width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .info-tooltip.show { display: block; }
        .info-tooltip h4 { color: var(--text-primary); font-size: 13px; margin-bottom: 6px; }
        .info-tooltip ul { padding-left: 16px; }
        .info-tooltip li { margin-bottom: 2px; }
        .info-tooltip .severity-high { color: var(--accent-red); }
        .info-tooltip .severity-medium { color: var(--accent-amber); }
        .info-tooltip .severity-low { color: var(--accent-blue); }
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .chart-card { background: var(--bg-card); border-radius: 10px; padding: 20px; border: 1px solid var(--border); }
        .chart-card h3 { font-size: 14px; font-weight: 500; margin-bottom: 12px; color: var(--text-secondary); }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .section-title .section-icon { width: 4px; height: 18px; border-radius: 2px; background: var(--accent-blue); }
        .tag-distribution { margin-bottom: 24px; }
        .tag-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tag-card { background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; transition: border-color 0.2s; }
        .tag-card:hover { border-color: var(--accent-blue); }
        .tag-card-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; user-select: none; transition: background 0.2s; }
        .tag-card-header:hover { background: var(--bg-hover); }
        .tag-card-left { display: flex; align-items: center; gap: 10px; }
        .tag-card-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .tag-card-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
        .tag-card-count { font-size: 12px; color: var(--accent-blue); background: rgba(88,166,255,0.1); padding: 2px 8px; border-radius: 10px; }
        .tag-card-right { display: flex; align-items: center; gap: 10px; }
        .tag-card-sentiment-mini { display: flex; gap: 4px; font-size: 11px; }
        .mini-pos { color: var(--accent-green); background: rgba(63,185,80,0.1); padding: 1px 6px; border-radius: 3px; }
        .mini-neu { color: var(--text-secondary); background: rgba(139,148,158,0.1); padding: 1px 6px; border-radius: 3px; }
        .mini-neg { color: var(--accent-red); background: rgba(248,81,73,0.1); padding: 1px 6px; border-radius: 3px; }
        .tag-card-arrow { font-size: 12px; color: var(--text-muted); transition: transform 0.2s; }
        .tag-card-arrow.open { transform: rotate(90deg); }
        .tag-card-detail { border-top: 1px solid var(--border); padding: 0; max-height: 400px; overflow-y: auto; }
        .tag-detail-item { display: flex; align-items: flex-start; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.5; transition: background 0.15s; }
        .tag-detail-item:last-child { border-bottom: none; }
        .tag-detail-item:hover { background: var(--bg-hover); }
        .tag-detail-sentiment { flex-shrink: 0; font-size: 10px; line-height: 1.5; }
        .tag-detail-source { color: var(--accent-cyan); flex-shrink: 0; font-weight: 500; }
        .tag-detail-title { color: var(--text-primary); text-decoration: none; }
        .tag-detail-title:hover { color: var(--accent-blue); }
        .tag-detail-summary { color: var(--text-muted); font-size: 12px; }
        .daily-summary { background: var(--bg-card); border-radius: 10px; padding: 20px 24px; border: 1px solid var(--border); margin-bottom: 24px; }
        .daily-summary .summary-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--accent-cyan); }
        .daily-summary .summary-title .summary-icon { font-size: 18px; }
        .daily-summary .summary-text { font-size: 14px; color: var(--text-secondary); line-height: 2; }
        .alerts-section { margin-bottom: 24px; }
        .alert-item { background: var(--bg-card); border-radius: 8px; padding: 14px 18px; border-left: 3px solid var(--accent-amber); margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .alert-item.severity-high { border-left-color: var(--accent-red); }
        .alert-item.severity-medium { border-left-color: var(--accent-amber); }
        .alert-item.severity-low { border-left-color: var(--accent-blue); }
        .alert-item .icon { font-size: 16px; }
        .alert-item .msg { flex: 1; }
        .channel-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .channel-tab { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 13px; color: var(--text-secondary); transition: all 0.2s; }
        .channel-tab:hover { background: var(--bg-hover); color: var(--text-primary); }
        .channel-tab.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
        .channel-content { display: none; }
        .channel-content.active { display: block; }
        .channel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .channel-header h2 { font-size: 16px; font-weight: 500; }
        .channel-stats { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); }
        .post-item { background: var(--bg-card); border-radius: 8px; padding: 16px; border: 1px solid var(--border); margin-bottom: 10px; transition: border-color 0.2s; }
        .post-item:hover { border-color: var(--accent-blue); }
        .post-item .post-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
        .post-item .post-title { font-size: 14px; font-weight: 500; flex: 1; }
        .post-item .post-title a { color: var(--text-primary); text-decoration: none; }
        .post-item .post-title a:hover { color: var(--accent-blue); }
        .post-item .post-sentiment { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; white-space: nowrap; }
        .post-item .post-sentiment.positive { background: rgba(63,185,80,0.15); color: var(--accent-green); }
        .post-item .post-sentiment.neutral { background: rgba(139,148,158,0.15); color: var(--text-secondary); }
        .post-item .post-sentiment.negative { background: rgba(248,81,73,0.15); color: var(--accent-red); }
        .post-item .post-summary { color: var(--text-secondary); font-size: 13px; margin-bottom: 10px; line-height: 1.5; }
        .post-item .post-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .post-item .post-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: rgba(88,166,255,0.1); color: var(--accent-blue); }
        .post-item .post-metric { font-size: 12px; color: var(--text-muted); }
        .post-item .post-source { font-size: 12px; color: var(--accent-cyan); font-weight: 500; }
        .post-item .post-url { font-size: 12px; color: var(--accent-blue); text-decoration: none; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
        .post-item .post-url:hover { text-decoration: underline; }
        .tag-change.up { color: var(--accent-red); }
        .tag-change.down { color: var(--accent-green); }
        /* 游戏切换页签 (左上角) */
        .game-tabs { display: flex; gap: 6px; padding: 14px 0 0 0; margin-bottom: 14px; }
        .game-tab { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text-secondary); transition: all 0.2s; user-select: none; }
        .game-tab:hover { border-color: var(--accent-blue); color: var(--text-primary); }
        .game-tab.active { background: linear-gradient(135deg, rgba(88,166,255,0.15), rgba(188,140,255,0.1)); border-color: var(--accent-blue); color: var(--text-primary); font-weight: 600; box-shadow: 0 0 0 1px rgba(88,166,255,0.3); }
        .game-tab .game-icon { font-size: 18px; }
        .game-tab .game-stats { font-size: 11px; color: var(--text-muted); margin-left: 4px; padding: 2px 6px; border-radius: 3px; background: rgba(255,255,255,0.05); }
        .game-tab.active .game-stats { color: var(--accent-blue); background: rgba(88,166,255,0.15); }
        /* 舆情预警升级区 */
        .crisis-section { margin-bottom: 24px; }
        .crisis-card { background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 12px; }
        .crisis-card-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
        .crisis-severity { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
        .crisis-severity.high { background: var(--accent-red); }
        .crisis-severity.medium { background: var(--accent-amber); }
        .crisis-severity.low { background: var(--accent-blue); }
        .crisis-title { font-size: 14px; font-weight: 600; flex: 1; }
        .crisis-category { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: rgba(88,166,255,0.1); color: var(--accent-blue); }
        .crisis-body { padding: 14px 18px; }
        .crisis-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 10px; }
        .crisis-action { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 12px; border-radius: 4px; background: rgba(88,166,255,0.1); color: var(--accent-blue); border: 1px solid rgba(88,166,255,0.2); }
        /* 话题热度排行 */
        .hot-topics { margin-bottom: 24px; }
        .hot-topic-item { display: flex; align-items: center; gap: 12px; background: var(--bg-card); border-radius: 8px; padding: 12px 16px; border: 1px solid var(--border); margin-bottom: 8px; transition: border-color 0.2s; }
        .hot-topic-item:hover { border-color: var(--accent-blue); }
        .hot-topic-rank { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
        .hot-topic-rank.r1 { background: linear-gradient(135deg, #F85149, #DA3633); color: #fff; }
        .hot-topic-rank.r2 { background: linear-gradient(135deg, #D29922, #BB8009); color: #fff; }
        .hot-topic-rank.r3 { background: linear-gradient(135deg, #58A6FF, #388BFD); color: #fff; }
        .hot-topic-rank.rn { background: var(--bg-secondary); color: var(--text-muted); }
        .hot-topic-info { flex: 1; }
        .hot-topic-name { font-size: 14px; font-weight: 500; }
        .hot-topic-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .hot-topic-bar-wrap { width: 120px; height: 8px; background: var(--bg-secondary); border-radius: 4px; overflow: hidden; flex-shrink: 0; }
        .hot-topic-bar { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .hot-topic-count { font-size: 13px; font-weight: 600; min-width: 40px; text-align: right; color: var(--accent-blue); }
        /* 社群运营建议 */
        .ops-suggestions { margin-bottom: 24px; }
        .ops-card { background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 10px; }
        .ops-card-top { display: flex; align-items: center; gap: 10px; padding: 14px 18px; }
        .ops-priority-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .ops-priority-dot.high { background: var(--accent-red); box-shadow: 0 0 8px rgba(248,81,73,0.4); }
        .ops-priority-dot.medium { background: var(--accent-amber); }
        .ops-priority-dot.low { background: var(--accent-green); }
        .ops-card-title { font-size: 14px; font-weight: 600; flex: 1; }
        .ops-card-category { font-size: 11px; padding: 2px 8px; border-radius: 4px; }
        .ops-card-category.c舆情管控 { background: rgba(248,81,73,0.1); color: var(--accent-red); }
        .ops-card-category.c反外挂 { background: rgba(248,81,73,0.1); color: var(--accent-red); }
        .ops-card-category.c玩家体验 { background: rgba(210,153,34,0.1); color: var(--accent-amber); }
        .ops-card-category.c活动运营 { background: rgba(210,153,34,0.1); color: var(--accent-amber); }
        .ops-card-category.c正面放大 { background: rgba(63,185,80,0.1); color: var(--accent-green); }
        .ops-card-category.c社群运营 { background: rgba(88,166,255,0.1); color: var(--accent-blue); }
        .ops-card-category.c私域关注 { background: rgba(188,140,255,0.1); color: var(--accent-purple); }
        .ops-card-category.c日常维护 { background: rgba(139,148,158,0.1); color: var(--text-secondary); }
        .ops-card-body { padding: 0 18px 14px 38px; }
        .ops-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 8px; }
        .ops-action-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 10px; border-radius: 4px; background: rgba(57,210,192,0.1); color: var(--accent-cyan); border: 1px solid rgba(57,210,192,0.2); }
        /* 私域声音专区 */
        .private-voice-section { margin-bottom: 24px; }
        .pv-period-card { background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border); margin-bottom: 16px; overflow: hidden; }
        .pv-period-header { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); background: linear-gradient(135deg, rgba(188,140,255,0.05), rgba(57,210,192,0.05)); }
        .pv-source-badge { font-size: 12px; padding: 3px 10px; border-radius: 4px; background: rgba(188,140,255,0.15); color: var(--accent-purple); font-weight: 500; }
        .pv-period-label { font-size: 14px; font-weight: 600; }
        .pv-period-range { font-size: 12px; color: var(--text-muted); }
        .pv-highlight-item { display: flex; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); transition: background 0.15s; }
        .pv-highlight-item:last-child { border-bottom: none; }
        .pv-highlight-item:hover { background: var(--bg-hover); }
        .pv-heat-indicator { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; min-width: 40px; }
        .pv-heat-value { font-size: 16px; font-weight: 700; }
        .pv-heat-value.hot { color: var(--accent-red); }
        .pv-heat-value.warm { color: var(--accent-amber); }
        .pv-heat-value.cool { color: var(--accent-blue); }
        .pv-heat-label { font-size: 10px; color: var(--text-muted); }
        .pv-topic-info { flex: 1; }
        .pv-topic-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .pv-topic-content { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
        .pv-participants { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .pv-summary-bar { padding: 14px 18px; background: rgba(88,166,255,0.03); border-top: 1px solid var(--border); }
        .pv-summary-text { font-size: 13px; color: var(--text-secondary); line-height: 1.8; }
        .pv-hot-user { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 4px; background: rgba(88,166,255,0.1); color: var(--accent-blue); font-size: 12px; margin-right: 6px; margin-bottom: 6px; }
        .pv-hot-user .kol-badge { background: var(--accent-amber); color: #000; font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 700; }
        /* KOL用户卡片 */
        .kol-section { margin-bottom: 24px; }
        .kol-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .kol-card { background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border); padding: 14px 16px; transition: border-color 0.2s; }
        .kol-card:hover { border-color: var(--accent-blue); }
        .kol-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .kol-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; }
        .kol-name { font-size: 14px; font-weight: 500; }
        .kol-role { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 700; }
        .kol-role.KOL { background: var(--accent-amber); color: #000; }
        .kol-role.active { background: rgba(63,185,80,0.15); color: var(--accent-green); }
        .kol-source { font-size: 11px; color: var(--text-muted); margin-left: auto; }
        .kol-stats { display: flex; gap: 12px; font-size: 12px; color: var(--text-secondary); }
        .kol-top-post { font-size: 12px; color: var(--text-muted); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .kol-top-post a { color: var(--accent-blue); text-decoration: none; }
        .kol-top-post a:hover { text-decoration: underline; }
        .footer { margin-top: 40px; padding: 20px 0; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 12px; text-align: center; }

以大欺小的成分在里面，但这不影响我对它的评价；三角洲很舍得投资，前前后后和不少大明星联动过，第一届猛攻节的吴彦祖，新春活动的倪大红和刘涛，以及最近的姜文，","source":"TapTap","tags":["外挂作弊","运营策略","社交组队","活动反馈","跨界联动"],"sentiment":"neutral","metrics":{},"raw_content":"看了一圈这游戏啥毛病没有，起初作为第三人称的视角来看，我发现玩这个游戏的人不少。先说优点吧，画风精致细腻细节处理到位，但是移动端就另说了，毕竟处理能力摆在那里；随后是战斗手感，我个人觉得这个款游戏的手感做的是不错的，比较丝滑，而且把第一人称视角抖动厉害的通病解决了，至于我是怎么觉得战斗手感好的，这个很简单，我是个菜的离谱的人，在别的射击游戏里面我都是被当做AI处理的无论是go或者是瓦在不然和平精英等等，但是在这里面我能把KD打成正比，我承认有以大欺小的成分在里面，但这不影响我对它的评价；三角洲很舍得投资，前前后后和不少大明星联动过，第一届猛攻节的吴彦祖，新春活动的倪大红和刘涛，以及最近的姜文，都是在迎合玩家的喜好，运营节奏相当灵活。接下了就是缺点，首先就是大家最关心的爆率问题，搜打撤游戏没有爆率怎么搜打撤呢？这一点希望官方能够正视，有人说装糖就可以提高爆率了，但其实也不见得，我身边不少朋友一个人不杀但是爆率依旧拉跨，现在的玩家见红太困难了，一个六格就能把一个玩了很久的人开心得手舞足蹈，我玩三角洲的时间不算短了，但是跟那些老资历比起来还是不太够，我觉得我的发言可以代表很多人了；黑屋局，让大多玩家都被吓退的名词，作为一款竞技游戏，不断调整对局强度让玩家提高技术的同时排到合适的对局完全没有问题，但是进了黑屋局就代表这一局游戏凶多吉少九死一生，哪怕活着走出来也还有下一关等着大家，进了黑屋局那就不得不提一下挂了，这是让玩家很心寒的地方。为什么这款游戏会外挂横行？参考一个历史事件，为什么每逢乱世就有各种恶霸出现？从平民百姓到官人将军，那就要思考为什么会有乱世，无非是天灾人祸，无论哪一点都直接指明了是官不管事。现在的游戏环境也是一样，甚至更恶劣，做勇敢者行动的除了技术过硬的人普通玩家根本完成不了，任务难度过高只好借助第三方工具，第三方工具最出色的就是监狱了吧，野排进去没几个猛攻的，全是跑刀的，一看核心区大脚步，你要是全装进去队友在身侧那我不说什么，卡战备还敢这样走而且前进目的很明确该怎么解释呢？；每个赛季的 3x3 大保险，先不说那些帮忙完成的靠的是什么，进了夜坝一看，全是买卖命的，那跟午夜小巷子里面的发廊有什么区别？人家真的想买卖吗？看起来是两赢的局面，一个完成任务了一个赚到钱了，那么这个 3x3 做的意义是什么？究竟是为了区别玩家的厉害程度还是为了什么？说句坦白的话，普通玩家费劲巴拉完成了任务还要去面对低保爆加黑屋，换谁不崩溃，换谁不退游？只有纯粹的喜欢才会留下和回游吧？那为什么不好好珍惜呢？","crawled_at":"2026-05-26T02:33:00.395Z","sentiment_score":0.39},{"title":"我就是没玩过，而且这个更新太慢了。","url":"https://www.taptap.cn/app/330259/review","summary":"我就是没玩过，而且这个更新太慢了。","source":"TapTap","tags":[],"sentiment":"neutral","metrics":{},"raw_content":"我就是没玩过，而且这个更新太慢了。","crawled_at":"2026-05-26T02:33:00.395Z","sentiment_score":0.5},{"title":"累计发布 1 条有帮助的游戏评价","url":"https://www.taptap.cn/app/330259/review","summary":"累计发布 1 条有帮助的游戏评价","source":"TapTap","tags":[],"sentiment":"neutral","metrics":{},"raw_content":"累计发布 1 条有帮助的游戏评价","crawled_at":"2026-05-26T02:33:00.395Z","sentiment_score":0.5},{"title":"作为第一批入坑的玩家真的有太多想吐槽的，我先对想入坑的玩家提4个建议吧， 第一：如果你是一个人我建议找一个固排或者现实中...","url":"https://www.taptap.cn/app/330259/review","summary":"作为第一批入坑的玩家真的有太多想吐槽         document.getElementById('reportBody').innerHTML = '<div class="no-data" style="padding:60px 0;">⚠️ ' + meta.name + ' 暂无数据</div>';
    }
    
    // 同步URL参数
    if (window.history && window.history.replaceState) {
        var u = new URL(window.location.href);
        u.searchParams.set('game', gameKey);
        window.history.replaceState(null, '', u.toString());
    }
}

// 启动时根据URL参数自动切换游戏
(function() {
    try {
        var sp = new URLSearchParams(window.location.search);
        var g = sp.get('game');
        if (g && GAMES_DATA[g] && g !== CURRENT_GAME) {
            var tab = document.querySelector('.game-tab[data-game-key="' + g + '"]');
            if (tab) {
                CURRENT_GAME = g;
                ALL_DATA = (GAMES_DATA[g] || {}).allDatesData || {};
                AVAILABLE_DATES = (GAMES_DATA[g] || {}).availableDates || [];
                document.querySelectorAll('.game-tab').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                var meta = GAMES_META.find(function(gg) { return gg.key === g; });
                if (meta) {
                    var nameEl = document.getElementById('currentGameName');
                    if (nameEl) nameEl.textContent = meta.name;
                    document.title = meta.name + ' · 用户声音日报';
                }
            }
        }
    } catch (e) { /* ignore */ }
})();

var sc = null, tc = null;
var currentData = null;

function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toggleDatePicker() {
    var dd = document.getElementById('dateDropdown');
    var arrow = document.getElementById('datePickerArrow');
    dd.classList.toggle('show');
    arrow.classList.toggle('open');
}
document.addEventListener('click', function(e) {
    var wrap = document.querySelector('.date-picker-wrap');
    var dd = document.getElementById('dateDropdown');
    if (wrap && !wrap.contains(e.target)) {
        dd.classList.remove('show');
        document.getElementById('datePickerArrow').classList.remove('open');
    }
});

function loadAvailableDates() {
    availableDates = AVAILABLE_DATES;
    renderDatePicker();
    if (availableDates.length > 0) {
        loadReport(availableDates[0]);
    }
}

function renderDatePicker() {
    var dd = document.getElementById('dateDropdown');
    if (availableDates.length === 0) {
        dd.innerHTML = '<div class="date-option no-data">暂无历史数据</div>';
        return;
    }
    dd.innerHTML = availableDates.map(function(d, i) {
        return '<div class="date-option' + (i === 0 ? ' active' : '') + '" onclick="selectDate(\'' + d + '\', this)">' + d + '</div>';
    }).join('');
}

function selectDate(date, el) {
    document.querySelectorAll('.date-option').forEach(function(o) { o.classList.remove('active'); });
    if (el) el.classList.add('active');
    document.getElementById('dateDropdown').classList.remove('show');
    document.getElementById('datePickerArrow').classList.remove('open');
    loadReport(date);
}

function loadReport(date) {
    document.getElementById('reportBody').innerHTML = '<div class="loading"><div class="spinner"></div>正在加载 ' + date + ' 数据...</div>';
    var data = ALL_DATA[date];
    if (data) {
        currentData = data;
        renderReport(data);
    } else {
        document.getElementById('reportBody').innerHTML = '<div class="no-data" style="padding:60px 0;">⚠️ ' + date + ' 暂无数据</div>';
    }
}

function generateDailySummary(data) {
    var total = data.summary.total_mentions;
    var sent = data.summary.sentiment;
    var topTags = data.summary.top_tags || [];
    var alerts = (data.trend && data.trend.alerts) || [];
    
    var posPct = sent.positive_pct;
    var negPct = sent.negative_pct;
    
    var moodDesc = '';
    if (posPct > negPct + 15) moodDesc = '整体偏正面，玩家反馈以积极为主';
    else if (negPct > posPct + 15) moodDesc = '整体偏负面，需重点关注玩家不满';
    else if (negPct > 40) moodDesc = '负面声量偏高，部分问题引发集中投诉';
    else if (posPct > 35) moodDesc = '正面声量较高，玩家整体体验良好';
    else moodDesc = '正负面声量接近，玩家态度分化明显';
    
    var tagDesc = '';
    if (topTags.length > 0) {
        var top3 = topTags.slice(0, 3).map(function(t) { var tag = Array.isArray(t) ? t[0] : t; var cnt = Array.isArray(t) ? t[1] : ''; return '「' + tag + '」' + (cnt ? '(' + cnt + '条)' : ''); });
        tagDesc = '讨论最热烈的话题依次为 ' + top3.join('、');
        if (topTags.length > 3) {
            var rest = topTags.slice(3, 6).map(function(t) { return '「' + (Array.isArray(t) ? t[0] : t) + '」'; });
            tagDesc += '，其次为 ' + rest.join('、') + ' 等';
        }
    }
    
    var alertDesc = '';
    if (alerts.length > 0) {
        var highAlerts = alerts.filter(function(a) { return a.severity === 'high'; });
        var medAlerts = alerts.filter(function(a) { return a.severity === 'medium'; });
        if (highAlerts.length > 0) alertDesc += '⚠️ 存在' + highAlerts.length + '项高等级预警（' + highAlerts.map(function(a) { return a.message; }).join('；') + '）';
        if (medAlerts.length > 0) alertDesc += (highAlerts.length > 0 ? '；' : '') + '有' + medAlerts.length + '项中等预警需关注';
    } else {
        alertDesc = '无异常预警';
    }
    
    var trend = data.trend || {};
    var trendDesc = '';
    if (trend.has_comparison && trend.total_mentions_change != null) {
        var chg = trend.total_mentions_change;
        if (chg > 10) trendDesc = '总声量较昨日上升' + chg + '%，讨论热度增加';
        else if (chg < -10) trendDesc = '总声量较昨日下降' + Math.abs(chg) + '%，讨论热度降低';
        else trendDesc = '总声量与昨日基本持平';
    } else {
        trendDesc = '首次采集，暂无趋势对比数据';
    }
    
    return '今日共采集' + total + '条用户声音，其中正面' + sent.positive + '条(' + posPct + '%)、中性' + sent.neutral + '条(' + sent.neutral_pct + '%)、负面' + sent.negative + '条(' + negPct + '%)。' + moodDesc + '。' + tagDesc + '。' + trendDesc + '。' + alertDesc + '。';
}

function renderReport(data) {
    var sent = data.summary.sentiment;
    var topTags = data.summary.top_tags || [];
    // topTags 可能是 [["标签",count],...] 或 {"标签":count,...}
    var tagEntries = [];
    if (Array.isArray(topTags)) {
        tagEntries = topTags;
    } else {
        tagEntries = Object.entries(topTags);
    }
    
    var channels = data.channels || {};
    var channelNames = Object.keys(channels);
    var trend = data.trend || { alerts: [], tag_changes: {}, channel_changes: {} };
    
    // 更新头部日期
    document.getElementById('currentDate').textContent = data.date;
    document.getElementById('generatedAt').textContent = '生成时间: ' + (data.generated_at || '-');
    document.getElementById('dataCoverage').textContent = '数据覆盖: ' + (data.data_coverage || data.date);
    document.title = '三角洲行动 · 用户声音日报 ' + data.date;
    
    // 趋势
    var trendChangeHtml = trend.has_comparison && trend.total_mentions_change != null
        ? '较昨日 ' + (trend.total_mentions_change > 0 ? '+' : '') + trend.total_mentions_change + '%'
        : '首次采集';
    var trendChangeClass = trend.total_mentions_change > 0 ? 'up' : (trend.total_mentions_change < 0 ? 'down' : '');
    var alertText = trend.alerts.length > 0 ? '需关注' : '无异常';
    
    // 标签分布
    var tagColors = ['#58A6FF', '#3FB950', '#D29922', '#BC8CFF', '#39D2C0', '#F85149', '#FF7B72', '#79C0FF', '#FFA657', '#7EE787', '#D2A8FF', '#FF9BCE'];
    var tagCardsHtml = '';
    // 构建tagPostsMap
    var tagPostsMap = {};
    for (var chName in channels) {
        var chPosts = channels[chName].posts || [];
        for (var pi = 0; pi < chPosts.length; pi++) {
            var tags = chPosts[pi].tags || [];
            for (var ti = 0; ti < tags.length; ti++) {
                if (!tagPostsMap[tags[ti]]) tagPostsMap[tags[ti]] = [];
                tagPostsMap[tags[ti]].push({
                    title: chPosts[pi].title,
                    source: chPosts[pi].source,
                    sentiment: chPosts[pi].sentiment,
                    summary: (chPosts[pi].summary || '').slice(0, 150),
                    url: chPosts[pi].url || ''
                });
            }
        }
    }
    
    for (var i = 0; i < tagEntries.length; i++) {
        var tagName = Array.isArray(tagEntries[i]) ? tagEntries[i][0] : tagEntries[i];
        var tagCount = Array.isArray(tagEntries[i]) ? tagEntries[i][1] : (topTags[tagEntries[i]] || 0);
        var color = tagColors[i % tagColors.length];
        var tagChange = trend.tag_changes ? (trend.tag_changes[tagName] || null) : null;
        var changePct = tagChange ? tagChange.change_pct : null;
        var changeClass = changePct > 0 ? 'up' : (changePct < 0 ? 'down' : '');
        var changeStr = changePct != null ? (changePct > 0 ? '+' : '') + changePct + '%' : '';
        
        var tagPostList = (tagPostsMap[tagName] || []).map(function(p) {
            var sentimentIcon = p.sentiment === 'positive' ? '🟢' : (p.sentiment === 'negative' ? '🔴' : '⚪');
            var summaryStr = p.summary ? ' — ' + escHtml(p.summary) : '';
            return '<div class="tag-detail-item">' +
                '<span class="tag-detail-sentiment">' + sentimentIcon + '</span>' +
                '<span class="tag-detail-source">[' + escHtml(p.source) + ']</span>' +
                (p.url ? '<a class="tag-detail-title" href="' + p.url + '" target="_blank">' + escHtml(p.title) + '</a>' : '<span class="tag-detail-title">' + escHtml(p.title) + '</span>') +
                '<span class="tag-detail-summary">' + summaryStr + '</span>' +
                '</div>';
        }).join('');
        
        var tagPostsArr = tagPostsMap[tagName] || [];
        var tagPosCount = tagPostsArr.filter(function(p) { return p.sentiment === 'positive'; }).length;
        var tagNegCount = tagPostsArr.filter(function(p) { return p.sentiment === 'negative'; }).length;
        var tagNeuCount = tagPostsArr.filter(function(p) { return p.sentiment === 'neutral'; }).length;
        
        var safeTagId = tagName.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');
        tagCardsHtml += '<div class="tag-card" data-tag="' + escHtml(tagName) + '">' +
            '<div class="tag-card-header" onclick="toggleTagDetail(\'' + safeTagId + '\')">' +
                '<div class="tag-card-left">' +
                    '<span class="tag-card-dot" style="background:' + color + '"></span>' +
                    '<span class="tag-card-name">' + escHtml(tagName) + '</span>' +
                    '<span class="tag-card-count">' + tagCount + '条</span>' +
                '</div>' +
                '<div class="tag-card-right">' +
                    '<span class="tag-card-sentiment-mini">' +
                        '<span class="mini-pos" title="正面">' + tagPosCount + '</span>' +
                        '<span class="mini-neu" title="中性">' + tagNeuCount + '</span>' +
                        '<span class="mini-neg" title="负面">' + tagNegCount + '</span>' +
                    '</span>' +
                    (changeStr ? '<span class="tag-change ' + changeClass + '">' + changeStr + '</span>' : '') +
                    '<span class="tag-card-arrow" id="arrow-' + safeTagId + '">▸</span>' +
                '</div>' +
            '</div>' +
            '<div class="tag-card-detail" id="detail-' + safeTagId + '" style="display:none;">' +
                (tagPostList || '<div class="no-data">暂无详细帖子</div>') +
            '</div>' +
        '</div>';
    }
    
    // 预警
    var alertsHtml = (trend.alerts || []).map(function(alert) {
        var icon = alert.severity === 'high' ? '&#9888;' : (alert.severity === 'medium' ? '&#9888;' : '&#8505;');
        return '<div class="alert-item severity-' + alert.severity + '">' +
            '<span class="icon">' + icon + '</span>' +
            '<span class="msg">' + escHtml(alert.message) + '</span>' +
        '</div>';
    }).join('');
    
    // 阵地Tab
    var channelTabsHtml = channelNames.map(function(name, i) {
        return '<div class="channel-tab' + (i === 0 ? ' active' : '') + '" onclick="switchChannel(\'' + escHtml(name) + '\')">' + escHtml(name) + '</div>';
    }).join('');
    
    // 阵地内容
    var channelContentHtml = '';
    for (var ci = 0; ci < channelNames.length; ci++) {
        var cName = channelNames[ci];
        var chData = channels[cName];
        var chStats = chData.stats || { positive: 0, neutral: 0, negative: 0 };
        var chChange = trend.channel_changes ? trend.channel_changes[cName] : null;
        var chChangeStr = chChange && chChange.change_pct != null ? (chChange.change_pct > 0 ? '+' : '') + chChange.change_pct + '%' : '-';
        
        var postsHtml = '';
        if (chData.posts && chData.posts.length > 0) {
            postsHtml = chData.posts.map(function(post) {
                var sentimentLabel = { positive: '正面', neutral: '中性', negative: '负面' }[post.sentiment] || '中性';
                var tagsHtml = (post.tags || []).map(function(t) { return '<span class="post-tag">' + escHtml(t) + '</span>'; }).join('');
                var metricsHtml = Object.entries(post.metrics || {})
                    .filter(function(kv) { return kv[1]; })
                    .map(function(kv) {
                        var labelMap = { plays: '播放', comments: '评论', views: '浏览', likes: '赞', danmaku: '弹幕', votes_up: '有用', playtime_hours: '游玩h', total_reviews: '总评测', positive_pct: '好评率%' };
                        return '<span class="post-metric">' + (labelMap[kv[0]] || kv[0]) + ': ' + kv[1] + '</span>';
                    }).join('');
                
                return '<div class="post-item">' +
                    '<div class="post-header">' +
                        '<div class="post-title"><a href="' + (post.url || '#') + '" target="_blank">' + escHtml(post.title) + '</a></div>' +
                        '<span class="post-sentiment ' + post.sentiment + '">' + sentimentLabel + '</span>' +
                    '</div>' +
                    (post.summary ? '<div class="post-summary">' + escHtml(post.summary) + '</div>' : '') +
                    '<div class="post-meta">' +
                        '<span class="post-source">[' + escHtml(post.source) + ']</span>' +
                        tagsHtml + metricsHtml +
                        (post.url ? '<a class="post-url" href="' + post.url + '" target="_blank" title="' + escHtml(post.url) + '">' + escHtml(post.url) + '</a>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        } else {
            postsHtml = '<div class="no-data">该阵地暂无采集数据</div>';
        }
        
        channelContentHtml += '<div class="channel-content' + (ci === 0 ? ' active' : '') + '" id="channel-' + cName + '">' +
            '<div class="channel-header">' +
                '<h2>' + escHtml(cName) + '</h2>' +
                '<div class="channel-stats">' +
                    '<span>帖子数: ' + (chData.posts ? chData.posts.length : 0) + '</span>' +
                    '<span>正面: ' + chStats.positive + '</span>' +
                    '<span>负面: ' + chStats.negative + '</span>' +
                    '<span>较昨日: ' + chChangeStr + '</span>' +
                '</div>' +
            '</div>' +
            postsHtml +
        '</div>';
    }
    
    // 每日总结
    var dailySummary = generateDailySummary(data);
    
    // 趋势数据
    var trendDates = data.trend_dates || [];
    var trendTotal = data.trend_total || [];
    var trendPositive = data.trend_positive || [];
    var trendNegative = data.trend_negative || [];
    
    // 组装HTML
    var html = '';
    html += '<div class="metrics-grid">';
    html += '<div class="metric-card total"><div class="label">总声量</div><div class="value">' + data.summary.total_mentions + '</div><div class="change ' + trendChangeClass + '">' + trendChangeHtml + '</div></div>';
    html += '<div class="metric-card positive"><div class="label">正面声量</div><div class="value">' + sent.positive + '</div><div class="change">' + sent.positive_pct + '%</div></div>';
    html += '<div class="metric-card negative"><div class="label">负面声量</div><div class="value">' + sent.negative + '</div><div class="change">' + sent.negative_pct + '%</div></div>';
    html += '<div class="metric-card alert"><div class="label">预警项 <i class="info-badge" onclick="toggleAlertInfo(event)" title="查看预警定义">?</i><div class="info-tooltip" id="alertInfoTooltip"><h4>预警项定义</h4><ul><li><span class="severity-high">● 高等级</span>：负面声量较昨日增长 &gt;50%</li><li><span class="severity-medium">● 中等级</span>：负面声量较昨日增长 30%-50%，或某标签讨论量较昨日增长 &gt;50%且≥3条</li><li><span class="severity-low">● 低等级</span>：总声量较昨日下降 &gt;30%</li></ul><div style="margin-top:8px;color:var(--text-muted);">预警基于当日与昨日数据的同比变化自动计算</div></div></div><div class="value">' + (trend.alerts ? trend.alerts.length : 0) + '</div><div class="change">' + alertText + '</div></div>';
    html += '</div>';
    
    html += '<div class="charts-row">';
    html += '<div class="chart-card"><h3>情绪分布</h3><div id="sentimentChart" style="height: 280px;"></div></div>';
    html += '<div class="chart-card"><h3>声量趋势 (近7天)</h3><div id="trendChart" style="height: 280px;"></div></div>';
    html += '</div>';
    
    html += '<div class="tag-distribution"><div class="section-title"><span class="section-icon"></span>标签分布</div><div class="tag-cards">' + tagCardsHtml + '</div></div>';
    
    html += '<div class="daily-summary"><div class="summary-title"><span class="summary-icon">📋</span>每日整体总结</div><div class="summary-text">' + escHtml(dailySummary) + '</div></div>';
    
    // === 舆情预警升级区 ===
    if (trend.alerts && trend.alerts.length > 0) {
        html += '<div class="crisis-section"><div class="section-title"><span class="section-icon" style="background:var(--accent-red)"></span>舆情预警</div>';
        var crisisSorted = (trend.alerts || []).slice().sort(function(a, b) {
            var order = { high: 0, medium: 1, low: 2 };
            return (order[a.severity] || 2) - (order[b.severity] || 2);
        });
        for (var ci = 0; ci < crisisSorted.length; ci++) {
            var cAlert = crisisSorted[ci];
            var sevLabel = { high: '高', medium: '中', low: '低' }[cAlert.severity] || '低';
            html += '<div class="crisis-card"><div class="crisis-card-header">' +
                '<span class="crisis-severity ' + cAlert.severity + '">' + sevLabel + '</span>' +
                '<span class="crisis-title">' + escHtml(cAlert.message) + '</span>' +
                '</div></div>';
        }
        html += '</div>';
    }

    // === 话题热度排行 ===
    html += '<div class="hot-topics"><div class="section-title"><span class="section-icon" style="background:var(--accent-amber)"></span>话题热度排行</div>';
    var hotTagEntries = tagEntries.slice(0, 8);
    var maxTagCount = hotTagEntries.length > 0 ? (Array.isArray(hotTagEntries[0]) ? hotTagEntries[0][1] : 1) : 1;
    for (var hi = 0; hi < hotTagEntries.length; hi++) {
        var hTagName = Array.isArray(hotTagEntries[hi]) ? hotTagEntries[hi][0] : hotTagEntries[hi];
        var hTagCount = Array.isArray(hotTagEntries[hi]) ? hotTagEntries[hi][1] : 1;
        var rankClass = hi < 3 ? 'r' + (hi + 1) : 'rn';
        var barPct = Math.round(hTagCount / maxTagCount * 100);
        var barColor = hi === 0 ? 'var(--accent-red)' : (hi === 1 ? 'var(--accent-amber)' : (hi === 2 ? 'var(--accent-blue)' : 'var(--accent-cyan)'));
        var hTagChange = trend.tag_changes ? trend.tag_changes[hTagName] : null;
        var hChangeStr = hTagChange && hTagChange.change_pct != null ? (hTagChange.change_pct > 0 ? '+' : '') + hTagChange.change_pct + '%' : '';
        var hChangeColor = hChangeStr.startsWith('+') ? 'var(--accent-red)' : (hChangeStr.startsWith('-') ? 'var(--accent-green)' : 'var(--text-muted)');
        html += '<div class="hot-topic-item">' +
            '<span class="hot-topic-rank ' + rankClass + '">' + (hi + 1) + '</span>' +
            '<div class="hot-topic-info"><div class="hot-topic-name">' + escHtml(hTagName) + '</div>' +
            '<div class="hot-topic-meta">' + (hChangeStr ? '较昨日 <span style="color:' + hChangeColor + '">' + hChangeStr + '</span>' : '首次统计') + '</div></div>' +
            '<div class="hot-topic-bar-wrap"><div class="hot-topic-bar" style="width:' + barPct + '%;background:' + barColor + '"></div></div>' +
            '<span class="hot-topic-count">' + hTagCount + '条</span></div>';
    }
    html += '</div>';

    // === 社群运营建议 ===
    var opSuggestions = data.operation_suggestions || [];
    html += '<div class="ops-suggestions"><div class="section-title"><span class="section-icon" style="background:var(--accent-cyan)"></span>社群运营建议</div>';
    for (var oi = 0; oi < opSuggestions.length; oi++) {
        var ops = opSuggestions[oi];
        var catClass = 'c' + (ops.category || '').replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '');
        html += '<div class="ops-card"><div class="ops-card-top">' +
            '<span class="ops-priority-dot ' + ops.priority + '"></span>' +
            '<span class="ops-card-title">' + escHtml(ops.title) + '</span>' +
            '<span class="ops-card-category ' + catClass + '">' + escHtml(ops.category) + '</span>' +
            '</div><div class="ops-card-body">' +
            '<div class="ops-detail">' + escHtml(ops.detail) + '</div>' +
            '<span class="ops-action-tag">→ ' + escHtml(ops.action) + '</span>' +
            '</div></div>';
    }
    html += '</div>';
    
    if (trend.alerts && trend.alerts.length > 0) {
        html += '<div class="alerts-section"><h3 style="font-size:15px;font-weight:500;margin-bottom:12px;color:var(--accent-amber);">预警与洞察</h3>' + alertsHtml + '</div>';
    }
    
    html += '<div class="section-title" style="margin-top:24px;"><span class="section-icon"></span>阵地详情</div>';
    html += '<div class="channel-tabs">' + channelTabsHtml + '</div>';
    html += channelContentHtml;

    // === KOL/活跃用户 ===
    var kolUsers = data.kol_users || [];
    if (kolUsers.length > 0) {
        html += '<div class="kol-section"><div class="section-title"><span class="section-icon" style="background:var(--accent-purple)"></span>KOL / 活跃用户</div><div class="kol-grid">';
        for (var ki = 0; ki < kolUsers.length; ki++) {
            var ku = kolUsers[ki];
            var roleClass = ku.role === 'KOL' ? 'KOL' : 'active';
            var initial = ku.name ? ku.name.charAt(0) : '?';
            html += '<div class="kol-card"><div class="kol-card-header">' +
                '<span class="kol-avatar">' + escHtml(initial) + '</span>' +
                '<span class="kol-name">' + escHtml(ku.name) + '</span>' +
                '<span class="kol-role ' + roleClass + '">' + escHtml(ku.role) + '</span>' +
                '<span class="kol-source">' + escHtml(ku.source) + '</span>' +
                '</div><div class="kol-stats">' +
                '<span>发帖 ' + ku.postCount + '</span>' +
                '<span>互动 ' + ku.totalEngagement + '</span>' +
                '<span>正面 ' + (ku.sentiments.positive || 0) + '</span>' +
                '<span>负面 ' + (ku.sentiments.negative || 0) + '</span>' +
                '</div>' +
                (ku.topPost ? '<div class="kol-top-post">🔥 热帖: ' + (ku.topPost.url ? '<a href="' + ku.topPost.url + '" target="_blank">' + escHtml(ku.topPost.title) + '</a>' : escHtml(ku.topPost.title)) + ' (' + ku.topPost.engagement + '互动)</div>' : '') +
                '</div>';
        }
        html += '</div></div>';
    }

    // === 私域声音专区 ===
    var pvData = data.private_voice || [];
    if (pvData.length > 0) {
        html += '<div class="private-voice-section"><div class="section-title"><span class="section-icon" style="background:var(--accent-purple)"></span>私域声音</div>';
        for (var pvi = 0; pvi < pvData.length; pvi++) {
            var pv = pvData[pvi];
            html += '<div class="pv-period-card"><div class="pv-period-header">' +
                '<span class="pv-source-badge">' + escHtml(pv.source || '私域') + '</span>' +
                '<span class="pv-period-label">' + escHtml(pv.week || pv.period || '') + '</span>' +
                '<span class="pv-period-range">' + escHtml(pv.period || '') + '</span>' +
                '</div>';
            var highlights = pv.highlights || [];
            for (var pi = 0; pi < highlights.length; pi++) {
                var ph = highlights[pi];
                var heatClass = ph.heat >= 70 ? 'hot' : (ph.heat >= 40 ? 'warm' : 'cool');
                var sentIcon = ph.sentiment === 'positive' ? '🟢' : (ph.sentiment === 'negative' ? '🔴' : '⚪');
                html += '<div class="pv-highlight-item">' +
                    '<div class="pv-heat-indicator"><span class="pv-heat-value ' + heatClass + '">' + (ph.heat || '-') + '</span><span class="pv-heat-label">热度</span></div>' +
                    '<div class="pv-topic-info"><div class="pv-topic-title">' + sentIcon + ' ' + escHtml(ph.topic) + '</div>' +
                    '<div class="pv-topic-content">' + escHtml(ph.content) + '</div>' +
                    (ph.participants ? '<div class="pv-participants">👤 ' + ph.participants + ' 人参与</div>' : '') +
                    '</div></div>';
            }
            // 私域活跃用户
            var hotUsers = pv.hot_users || [];
            if (hotUsers.length > 0) {
                html += '<div class="pv-summary-bar" style="padding-top:10px;">';
                for (var ui = 0; ui < hotUsers.length; ui++) {
                    var hu = hotUsers[ui];
                    html += '<span class="pv-hot-user">' + (hu.role === 'KOL' ? '<span class="kol-badge">KOL</span>' : '') + escHtml(hu.name) + ' · ' + escHtml(hu.contribution) + '</span>';
                }
                html += '</div>';
            }
            // 私域总结
            if (pv.summary) {
                html += '<div class="pv-summary-bar"><div class="pv-summary-text">📌 ' + escHtml(pv.summary) + '</div></div>';
            }
            html += '</div>';
        }
        html += '</div>';
    }
    
    document.getElementById('reportBody').innerHTML = html;
    
    // 渲染图表
    try {
        if (sc) sc.dispose();
        sc = echarts.init(document.getElementById('sentimentChart'));
        sc.setOption({tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'},series:[{type:'pie',radius:['40%','70%'],center:['50%','50%'],label:{color:'#8B949E',fontSize:12},itemStyle:{borderRadius:6,borderColor:'#1C2128',borderWidth:2},data:[{value:sent.positive,name:'正面',itemStyle:{color:'#3FB950'}},{value:sent.neutral,name:'中性',itemStyle:{color:'#8B949E'}},{value:sent.negative,name:'负面',itemStyle:{color:'#F85149'}}]}]});
    } catch(e) { document.getElementById('sentimentChart').innerHTML='<p style="color:#8B949E;text-align:center;padding-top:100px;">图表加载失败</p>'; }
    
    try {
        if (tc) tc.dispose();
        tc = echarts.init(document.getElementById('trendChart'));
        tc.setOption({tooltip:{trigger:'axis'},legend:{data:['总声量','正面','负面'],textStyle:{color:'#8B949E'},top:0},grid:{top:30,right:20,bottom:30,left:50},xAxis:{type:'category',data:trendDates,axisLabel:{color:'#8B949E'},axisLine:{lineStyle:{color:'#30363D'}}},yAxis:{type:'value',axisLabel:{color:'#8B949E'},splitLine:{lineStyle:{color:'#30363D'}}},series:[{name:'总声量',type:'line',data:trendTotal,smooth:true,lineStyle:{color:'#58A6FF',width:2},itemStyle:{color:'#58A6FF'}},{name:'正面',type:'line',data:trendPositive,smooth:true,lineStyle:{color:'#3FB950',width:1.5},itemStyle:{color:'#3FB950'}},{name:'负面',type:'line',data:trendNegative,smooth:true,lineStyle:{color:'#F85149',width:1.5},itemStyle:{color:'#F85149'}}]});
    } catch(e) { document.getElementById('trendChart').innerHTML='<p style="color:#8B949E;text-align:center;padding-top:100px;">图表加载失败</p>'; }
}

function switchChannel(name) {
    document.querySelectorAll('.channel-tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.channel-content').forEach(function(c) { c.classList.remove('active'); });
    var tab = document.querySelector('.channel-tab[onclick*="' + name + '"]');
    if (tab) tab.classList.add('active');
    var content = document.getElementById('channel-' + name);
    if (content) content.classList.add('active');
}

function toggleTagDetail(tag) {
    var detail = document.getElementById('detail-' + tag);
    var arrow = document.getElementById('arrow-' + tag);
    if (!detail || !arrow) return;
    if (detail.style.display === 'none' || detail.style.display === '') {
        detail.style.display = 'block';
        arrow.classList.add('open');
    } else {
        detail.style.display = 'none';
        arrow.classList.remove('open');
    }
}

function toggleAlertInfo(e) {
    e.stopPropagation();
    var tooltip = document.getElementById('alertInfoTooltip');
    if (tooltip) tooltip.classList.toggle('show');
}
document.addEventListener('click', function(e) {
    var tooltip = document.getElementById('alertInfoTooltip');
    if (tooltip && !tooltip.contains(e.target) && !e.target.classList.contains('info-badge')) {
        tooltip.classList.remove('show');
    }
});

window.addEventListener('resize', function() { if (sc) sc.resize(); if (tc) tc.resize(); });

// 初始化
loadAvailableDates();
</script>
</body>
</html>
